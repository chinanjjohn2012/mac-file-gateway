name: PR101 P003 six pinned Wheel bytes SHA/RECORD SOURCE-ONLY (no install)

on:
  pull_request:
    branches:
      - rc/multi-exec-f1-g05-integrated-ms1-20261025
    paths:
      - ".github/workflows/pr101-lbe-p003-wheel-bytes.yml"
      - "tools/lbe_pipenv_p003_wheel_bytes.py"
      - "tests/test_lbe_pipenv_p003_wheel_bytes.py"
      - "tools/lbe_pipenv_p002_metadata.py"
      - "ci/lbe-pipenv-p002-metadata-candidates.json"
      - "docs/PR101_PIPENV_P003_WHEEL_BYTE_QUALIFICATION.md"
      - "MANIFEST.sha256"

permissions:
  contents: read

concurrency:
  group: pr101-p003-wheel-source-only-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  source-only-six-wheels:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/multi-exec-lbe-v2-config-preflight-r001-20261030' &&
      github.event.pull_request.base.sha == '0fc1ae245de7cb582a69162c79c201d15bfaa258'
    runs-on: macos-15
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: ""
      PIP_NO_INDEX: "1"
      GOTOOLCHAIN: "local"
      GOPROXY: "off"
      GOSUMDB: "off"
      CGO_ENABLED: "0"
      GATEWAY_NATIVE_C_ALLOWED: "false"
      C3B03_S3S6_GROUP_SIGNAL_AUTHORIZED: "false"
      LBE_P003_SIX_P002_WHEEL_BYTE_DOWNLOAD_APPROVED: "source-only"
      LBE_P003_INSTALL_IMPORT_EXEC_IN_THIS_WORKFLOW: "false"
      LBE_P003_GO_PIPENV_NATIVE_AUTHORIZED: "false"
    steps:
      - name: Checkout real PR HEAD without persistent credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: HEAD and hosted macOS ARM64 G05 BEFORE any network
        shell: bash
        env:
          G05_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "${{ runner.environment }}" = github-hosted
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          [[ "$(sw_vers -productVersion)" == 15.* ]]
          python3 -I -S tools/g05_ci_admission.py --expected-head "$G05_EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$G05_EXPECTED_HEAD"
          test "$(git rev-parse HEAD:ci/lbe-pipenv-p002-metadata-candidates.json)" = "c39a83d001512169bf9bb2cc19a0e56b1c0d79c4"
          test "$(git rev-parse HEAD:docs/PR101_LBE_NATIVE_TOOLCHAINS_T1_PROPOSAL.md)" = "96bbd02cd384bd9769cd6af9f5a763442e25d61a"
          echo "LBE_P003_EXECUTED_HEAD=$(git rev-parse HEAD)"
          echo "LBE_P003_EXECUTED_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "LBE_P003_BASE=0fc1ae245de7cb582a69162c79c201d15bfaa258"
          echo "LBE_P003_ONLY_SIX_P002_WHEEL_BYTES=AUTHORIZED_SOURCE_ONLY"
          echo "LBE_P003_EXECUTION_IN_THIS_WORKFLOW=DISALLOWED"

      - name: Fail-closed synthetic Wheel/archive/download T0 before network
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S tests/test_lbe_pipenv_p003_wheel_bytes.py
          python3 -I -S tests/test_lbe_pipenv_p002_metadata.py
          echo "LBE_P003_OFFLINE_ADVERSARIAL_T0=PASS"
          echo "LBE_P003_NEW_WHEEL_BYTES_AT_THIS_STEP=NOT_DOWNLOADED"

      - name: Fetch ONLY six pinned official PyPI RELEASE JSON descriptions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/lbe-p003-release-json"
          for release in \
              distlib/0.4.4 \
              filelock/4.2.4 \
              platformdirs/4.11.10 \
              python-discovery/1.6.1 \
              setuptools/84.2.1 \
              virtualenv/21.15.0; do
            project="${release%%/*}"
            version="${release##*/}"
            curl --fail --silent --show-error --retry 0 \
              --proto '=https' --max-time 35 --max-filesize 4000000 \
              --output "$RUNNER_TEMP/lbe-p003-release-json/$project-$version.json" \
              "https://pypi.org/pypi/$project/$version/json"
          done
          echo "LBE_P003_PYPI_RELEASE_METADATA_ONLY_COUNT=6"

      - name: Download six exact URL-bound Wheel payloads and verify byte SHA and RECORD
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S tools/lbe_pipenv_p003_wheel_bytes.py \
            --lock ci/lbe-pipenv-p002-metadata-candidates.json \
            --runner-temp "$RUNNER_TEMP"
          test -s "$RUNNER_TEMP/lbe-p003-wheel-byte-evidence.json"
          test "$(find "$RUNNER_TEMP/lbe-p003-six-wheel-bytes" \
            -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')" = 6
          echo "LBE_P003_SIX_WHEEL_BYTE_INSPECTION=COMPLETE"
          echo "LBE_P003_SOURCE_SECURITY_REVIEW=NOT_ISSUED"

      - name: Recheck exact HEAD and report no installation or native execution
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          echo "LBE_P003_NEW_WHEELS_INSTALLED=FALSE"
          echo "LBE_P003_NEW_WHEELS_IMPORTED=FALSE"
          echo "LBE_P003_GO_PIPENV_NATIVE_EXECUTED=FALSE"
          echo "LBE_P003_FULL_PYTHON313_CLOSURE=NOT_QUALIFIED"
          echo "LBE_P003_FULL_CODE_REVIEW_PASS=NOT_ISSUED"
          echo "LBE_P003_NO_OS_SIGNAL_T2_T3_USER_MAC_PRODUCTION_MERGE_DEPLOY"
