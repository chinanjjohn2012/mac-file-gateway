name: controlled-exec-tests

on:
  push:
    branches:
      - main
      - release/ms1
  pull_request:
    paths:
      - ".github/workflows/**"
      - "gateway/**"
      - "tests/**"
      - "tools/**"
      - "docs/**"
      - "samples/**"
      - "README*.md"
      - "BUILD_INFO.json"
      - "MANIFEST.sha256"
      - "requirements*.txt"
      - "setup.sh"
      - "run.sh"
      - "verify.sh"
      - "tunnel.sh"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: G05 repository admission before setup, imports or tests
        env:
          G05_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -I -S tools/g05_ci_admission.py --expected-head "$G05_EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Resolve all binary wheel dependencies into a disposable isolated directory
        run: python -m pip download --disable-pip-version-check --only-binary=:all: -r requirements-dev.txt --dest "$RUNNER_TEMP/f1-g05-wheelhouse"
      - name: Record source wheel SHA256 before installation
        run: python -I -S tools/ci_dependency_provenance.py wheels --wheelhouse "$RUNNER_TEMP/f1-g05-wheelhouse" --wheel-record "$RUNNER_TEMP/f1-g05-wheels.json"
      - name: Install verified wheel inputs with the network index disabled
        run: python -m pip install --disable-pip-version-check --no-index --find-links "$RUNNER_TEMP/f1-g05-wheelhouse" --force-reinstall -r requirements-dev.txt
      - name: Record installed distribution bytes and import roots before running tests
        run: |
          python -m pip check
          python -I tools/ci_dependency_provenance.py installed --wheelhouse "$RUNNER_TEMP/f1-g05-wheelhouse" --wheel-record "$RUNNER_TEMP/f1-g05-wheels.json" --installed-record "$RUNNER_TEMP/f1-g05-installed.json"
      - run: python -m pytest -q -rs
      - run: python tests/smoke_live.py
      - run: python tests/smoke_mcp_live.py
      - run: python tests/smoke_mcp_stdio.py
      - run: python tests/smoke_mcp_disconnect.py
      - name: Disposable Git CLI Legacy/Multi MCP smoke
        run: python tests/smoke_git_cli.py
      - run: python -m compileall -q gateway tests tools
      - run: bash -n setup.sh run.sh verify.sh tunnel.sh
      - name: Check installed wheel and import identities remain unchanged after tests
        run: python -I tools/ci_dependency_provenance.py verify --wheelhouse "$RUNNER_TEMP/f1-g05-wheelhouse" --wheel-record "$RUNNER_TEMP/f1-g05-wheels.json" --installed-record "$RUNNER_TEMP/f1-g05-installed.json"
      - name: Verify release manifest
        run: |
          find . -type f \
            ! -path './.git/*' \
            ! -path './.pytest_cache/*' \
            ! -path '*/__pycache__/*' \
            ! -path './MANIFEST.sha256' \
            ! -name '*.pyc' ! -name '*.pyo' -print0 \
          | LC_ALL=C sort -z | xargs -0 sha256sum > /tmp/MANIFEST.sha256
          diff -u MANIFEST.sha256 /tmp/MANIFEST.sha256
