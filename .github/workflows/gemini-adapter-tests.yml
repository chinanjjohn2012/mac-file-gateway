name: gemini-adapter-tests
on:
  push:
    branches:
      - feature/gemini-dual-port
  pull_request:
    paths:
      - 'gateway/gemini_adapter/**'
      - 'tests/test_gemini_adapter.py'
      - 'docs/GEMINI_INTEGRATION.md'
      - 'samples/gemini-cloudflared.yml'
      - 'tunnel-gemini.sh'
      - 'requirements*.txt'
      - 'MANIFEST.sha256'
jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q gateway/gemini_adapter tests/test_gemini_adapter.py
      - run: python -m pytest -q tests/test_gemini_adapter.py
      - run: bash -n tunnel.sh tunnel-gemini.sh run.sh verify.sh
