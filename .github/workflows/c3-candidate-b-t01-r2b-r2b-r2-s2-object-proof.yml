name: C3 B03-T01 R2b-R2b-R2-S2 real inert C OBJECT proof (NO LOAD NO C EXEC)

on:
  push:
    branches:
      - research/phase2-lite-c3-candidate-b-kill-t01-r2b-r2b-r2-preload-s2-object-evidence-20261022
  pull_request:
    paths:
      - ".github/workflows/c3-candidate-b-t01-r2b-r2b-r2-s2-object-proof.yml"
      - "docs/research/phase2-lite-c3/candidate-b-b03-t01-r2b-r2b-r2-s2-object-proof.md"
      - "tools/research/c3_candidate_b_t01_s2_object_proof.py"
      - "tests/test_c3_candidate_b_t01_s2_object_proof.py"
      - "MANIFEST.sha256"

permissions:
  contents: read

jobs:
  candidate-c-object-inspect-only-no-load:
    if: >-
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/research/phase2-lite-c3-candidate-b-kill-t01-r2b-r2b-r2-preload-s2-object-evidence-20261022') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'research/phase2-lite-c3-candidate-b-kill-t01-r2b-r2b-r2-preload-s2-object-evidence-20261022')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            python-version: "3.13"
          - os: macos-15
            python-version: "3.14"
          - os: ubuntu-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      C3B03_T01_S2_SOURCE_ONLY_NO_LOAD: "true"
      C3B03_T01_S2_GROUP_SIGNAL_AUTHORIZED: "false"
      C3B03_TEST_NO_SIGNAL_STUB: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate exact fixed Head, manifest, no runtime helpers or binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          if [ "${{ matrix.os }}" = "macos-15" ]; then
            test "$(uname -s)" = Darwin
            test "$(uname -m)" = arm64
          else
            test "$(uname -s)" = Linux
            test "$(uname -m)" = x86_64
          fi
          test ! -e tools/research/c3_candidate_b_kill.c
          test ! -e tools/research/c3_candidate_b_kill_t01_no_signal_probe.py
          test ! -e tools/research/run_c3_candidate_b_kill.py
          test ! -e tools/research/c3_candidate_b_t01_no_signal_candidate.so
          test ! -e tools/research/c3_candidate_b_t01_no_signal_candidate.dylib
          python - <<'PY'
          import hashlib
          from pathlib import Path
          paths = Path("MANIFEST.sha256").read_text(encoding="utf-8").splitlines()
          for row in paths:
              expected, name = row.split("  ", 1)
              observed = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              if observed != expected:
                  raise AssertionError("MANIFEST_DIFF " + name)
          frozen = {
              "tools/research/c3_candidate_b_t01_no_signal_candidate.c":
                  "5a1292787584632fac20c86bbe62e50153e82b0ecb36ad190446bf4b7b714195",
              "tests/native/c3_b03_t01_no_signal_contract.h":
                  "7c9bd037ecf65da8de91605846c4ac4fc7ceaebbd0ca2fe983ecfef630c9958e",
          }
          for name, sha in frozen.items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != sha:
                  raise AssertionError("REVIEWED_PARENT_DRIFT " + name)
          print("C3B03_T01_S2_MANIFEST_OK=true")
          print("C3B03_T01_S2_SOURCE_ONLY_NO_LOAD=true")
          print("C3B03_T01_S2_C_EXECUTED=false")
          print("C3B03_T01_S2_NATIVE_DISPATCHES=0")
          print("C3B03_T01_S2_GROUP_SIGNAL_AUTHORIZED=false")
          PY
          python -m py_compile tools/research/c3_candidate_b_t01_s2_object_proof.py tests/test_c3_candidate_b_t01_s2_object_proof.py
      - name: Compile frozen inert C to temporary .o and inspect symbols and disassembly only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest==8.4.2
          # Candidate C is COMPILED AS OBJECT ONLY, then DISCARDED.
          # No linking to .dylib/.so, loading a library or invoking C entry.
          # -s emits actual compiler/source/object SHA and disassembly.
          python -m pytest -q -s tests/test_c3_candidate_b_t01_s2_object_proof.py tests/test_c3_candidate_b_t01_s0_abi_proof.py tests/test_c3_candidate_b_t01_r2b_r2a_source_admission.py tests/test_c3_candidate_b_t01_r2b_r2b_r2_source_only_adapter.py tests/test_c3_candidate_b_t01_r2b_r2b_r2_preload_d1_design.py
