# A developer source-only evidence helper; not PR101 product code or native execution.
# Isolated GitHub hosted macOS runner, only ten frozen official archives.
name: PR101 r015 exact-ten source-only byte and member evidence
on:
  push:
    branches:
      - evidence/pr101-r015-source-only-archives-20261101
    paths:
      - ".github/workflows/pr101-r015-source-only-archive-evidence.yml"

permissions:
  contents: read

concurrency:
  group: pr101-r015-ten-sources-isolated
  cancel-in-progress: false

jobs:
  static-external-byte-evidence:
    if: github.repository == 'chinanjjohn2012/mac-file-gateway' && github.ref == 'refs/heads/evidence/pr101-r015-source-only-archives-20261101'
    runs-on: macos-15
    timeout-minutes: 25
    env:
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ""
      PIP_NO_INDEX: "1"
      GOPROXY: "off"
      GOSUMDB: "off"
      GOTOOLCHAIN: "local"
      CGO_ENABLED: "0"
      GATEWAY_NATIVE_C_ALLOWED: "false"
      C3B03_S3S6_GROUP_SIGNAL_AUTHORIZED: "false"
      EXPECTED_HEAD: "ec25c34492912f3a82175fa9c1060e0632814687"
      EXPECTED_BASE: "0fc1ae245de7cb582a69162c79c201d15bfaa258"
      EXPECTED_TREE: "3a127bf341a0363b9fa77a570d88436a6fd48696"
    steps:
      - name: Checkout ORIGINAL immutable PR101 Head (not evidence branch) without credentials
        uses: actions/checkout@v4
        with:
          ref: ec25c34492912f3a82175fa9c1060e0632814687
          fetch-depth: 0
          path: frozen
          persist-credentials: false

      - name: G05 exact-Head native blob and Manifest admission BEFORE project code and network
        shell: bash
        working-directory: frozen
        run: |
          set -euo pipefail
          test "${{ runner.environment }}" = github-hosted
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          [[ "$(sw_vers -productVersion)" == 15.* ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          python3 -I -S tools/g05_ci_admission.py --expected-head "$EXPECTED_HEAD"
          echo "PR101_R015_SOURCE_ONLY_G05=PASS"
          echo "PR101_R015_EXECUTED_HEAD=$(git rev-parse HEAD)"
          echo "PR101_R015_EXECUTED_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "PR101_R015_BASE=$EXPECTED_BASE"

      - name: Offline source-only adversarial T0 without third-party imports
        shell: bash
        working-directory: frozen
        run: |
          set -euo pipefail
          python3 -I -S tests/test_lbe_t1_source_qualifier.py
          python3 -I -S tests/test_lbe_t1_go_stager.py
          python3 -I -S tests/test_lbe_p007_go_source_inventory.py
          python3 -I -S tests/test_lbe_p008_https_source_fetch.py
          python3 -I -S tests/test_lbe_pipenv_p002_metadata.py
          python3 -I -S tests/test_lbe_pipenv_p003_wheel_bytes.py
          python3 -I -S tests/test_lbe_pipenv_p006_source_inventory.py
          echo "PR101_R015_STATIC_SOURCE_ADVERSARIAL_T0=PASS"

      - name: Download approved exact Go 1.27.3 Darwin source-only with per-hop official HTTPS policy
        working-directory: frozen
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S tools/lbe_p008_https_source_fetch.py --kind go --runner-temp "$RUNNER_TEMP"
          echo "PR101_R015_REAL_GO_ARCHIVE_ACQUIRED_ONLY"

      - name: Download approved primary Pipenv published JSON then exactly pinned Wheel
        working-directory: frozen
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S tools/lbe_p008_https_source_fetch.py --kind metadata --runner-temp "$RUNNER_TEMP"
          python3 -I -S - "$RUNNER_TEMP/pipenv-2026.10.4-release.json" "$RUNNER_TEMP/pipenv-2026.10.4-url.txt" <<'PY'
          import json, sys
          from pathlib import Path
          from urllib.parse import urlsplit
          d=json.loads(Path(sys.argv[1]).read_text("utf-8"))
          n="pipenv-2026.10.4-py3-none-any.whl"
          h="308125623e4d08dfe32936f7259a9ed33c5480baa2c9a291a1ff8a9328eeeb1f"
          q=[x for x in d.get("urls",[]) if x.get("filename")==n and x.get("packagetype")=="bdist_wheel" and x.get("digests",{}).get("sha256")==h]
          if d.get("info",{}).get("version")!="2026.10.4" or len(q)!=1: raise SystemExit("pinned primary Pipenv metadata mismatch")
          u=q[0]["url"]; p=urlsplit(u)
          if p.scheme!="https" or p.netloc!="files.pythonhosted.org" or not p.path.startswith("/packages/") or not p.path.endswith("/"+n) or p.query or p.fragment: raise SystemExit("Pipenv URL not approved")
          Path(sys.argv[2]).write_text(u,encoding="utf-8")
          PY
          python3 -I -S tools/lbe_p008_https_source_fetch.py --kind wheel --runner-temp "$RUNNER_TEMP"
          python3 -I -S tools/lbe_t1_source_qualifier.py --runner-temp "$RUNNER_TEMP"
          echo "PR101_R015_GO_AND_PRIMARY_PIPENV_SHA_RECORD=PASS"

      - name: Acquire exact six P002 Wheel release JSONs and each SHA+RECORD (NO imports)
        working-directory: frozen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/lbe-p003-release-json"
          for rel in distlib/0.4.4 filelock/4.2.4 platformdirs/4.11.10 python-discovery/1.6.1 setuptools/84.2.1 virtualenv/21.15.0; do
            pkg="${rel%%/*}"
            ver="${rel##*/}"
            curl --fail --silent --show-error --retry 0 --proto '=https' --max-time 45 --max-filesize 4000000 \
              --output "$RUNNER_TEMP/lbe-p003-release-json/$pkg-$ver.json" \
              "https://pypi.org/pypi/$pkg/$ver/json"
          done
          python3 -I -S tools/lbe_pipenv_p003_wheel_bytes.py --lock ci/lbe-pipenv-p002-metadata-candidates.json --runner-temp "$RUNNER_TEMP"
          echo "PR101_R015_SIX_NEW_WHEEL_SHA_RECORD=PASS"

      - name: Acquire original R004 certifi and packaging exact official Wheel bytes WITHOUT install/import
        working-directory: frozen
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S - "$RUNNER_TEMP" <<'PY'
          import json,os,sys
          from pathlib import Path
          from urllib.request import Request,ProxyHandler,build_opener
          sys.path.insert(0,str(Path.cwd()))
          from tools.lbe_pipenv_p005_closure import EXPECTED
          from tools.lbe_pipenv_p003_wheel_bytes import NoRedirect,_download_wheel,_audit_wheel,_official_wheel_url
          root=Path(sys.argv[1])
          dest=root/"r015-original-r004-two-locked-wheels"
          dest.mkdir(mode=0o700)
          opener=build_opener(ProxyHandler({}),NoRedirect())
          for name in ("certifi","packaging"):
              version,filename,pinned=EXPECTED[name]
              url=f"https://pypi.org/pypi/{name}/{version}/json"
              with opener.open(Request(url,headers={"User-Agent":"mfg-r015-source-only/1"}),timeout=45) as response:
                  if response.status!=200 or response.geturl()!=url: raise SystemExit("unapproved metadata response")
                  raw=response.read(4_000_001)
              if not raw or len(raw)>4_000_000: raise SystemExit("metadata size outside bound")
              release=json.loads(raw)
              rows=[x for x in release.get("urls",[]) if x.get("filename")==filename and x.get("packagetype")=="bdist_wheel" and x.get("digests",{}).get("sha256")==pinned]
              if release.get("info",{}).get("version")!=version or len(rows)!=1: raise SystemExit("pinned R004 release missing/ambiguous")
              row=rows[0]; actual_url=row["url"];_official_wheel_url(actual_url,filename)
              size=row.get("size")
              out=dest/filename
              _download_wheel(actual_url,out,size,pinned)
              proof=_audit_wheel(out,{"name":name,"version":version,"filename":filename,"sha256":pinned},size)
              if not proof["bytes_verified"]: raise SystemExit("R004 Wheel byte/RECORD not proven")
              print("PR101_R015_R004_WHEEL_SHA_RECORD="+name+":"+pinned)
          PY

      - name: Nonexecuting Go P001 stage and exact P007 15657-file full reconciliation
        working-directory: frozen
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S tools/lbe_t1_go_stager.py --runner-temp "$RUNNER_TEMP"
          python3 -I -S tools/lbe_p007_go_source_inventory.py --runner-temp "$RUNNER_TEMP"
          echo "PR101_R015_GO_15657_FILES_NONEXECUTING_MANIFEST=PASS"
          echo "PR101_R015_GO_COMPILER_RUN=NOT_RUN"

      - name: Independent P006 nine-Wheel full ZIP-order member manifest cross-check and RECORD
        working-directory: frozen
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S - "$RUNNER_TEMP" <<'PY'
          import hashlib,json,os,stat,sys,zipfile
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()))
          from tools.lbe_pipenv_p005_closure import EXPECTED,NEW_SIX
          from tools.lbe_pipenv_p003_wheel_bytes import _audit_wheel
          from tools.lbe_t1_source_qualifier import inspect_pipenv_wheel
          original={
              "certifi":(12,"d5597f0f2f774b9a7a37b3a302bb9cad233d7467ae42fc0aabf11e0da10157e3"),
              "distlib":(24,"77a33b958864d9f019cf9083638bd17670ff1c4f794b277bef06d5dd27e8effb"),
              "filelock":(28,"7c95ac5aa99ab56c3f6325a926c5a80e24a753219e0ec03e6eb54599b6887030"),
              "packaging":(29,"8b68ce90180bb9b3ff7624228b1d37df4eee6862d7cabc53b00e62452bfd9679"),
              "pipenv":(721,"fcaabda802c52cf14fec5cc1af4c3ffbb367d08fe601578bd7c0fc81f10a5a66"),
              "platformdirs":(14,"5f578e64c3d55eafcf2e6af6790ddcfa07698ac309e0e4a04beda3a837290675"),
              "python-discovery":(17,"40d47e242ab802d9d0e873e2bcb48747c67822426725775c4ddddb3bbf782a66"),
              "setuptools":(348,"e160aead967f0dd63ba04ac4a5a9ea10271c8701f0a44c797ca755baddeee657"),
              "virtualenv":(115,"9afa4b28e4b4df7974cba1822c7ecac212be3f76a0e9ffa7a112062a0090a5e1"),
          }
          root=Path(sys.argv[1]); records={}
          for name,(version,filename,pinned) in sorted(EXPECTED.items()):
              if name in NEW_SIX: folder=root/"lbe-p003-six-wheel-bytes"
              elif name=="pipenv": folder=root
              else: folder=root/"r015-original-r004-two-locked-wheels"
              path=folder/filename; size=path.lstat().st_size
              if name=="pipenv":
                  q=inspect_pipenv_wheel(path,pinned,size)
                  if q.get("status")!="WHEEL_BYTES_AND_RECORD_VERIFIED": raise SystemExit("Pipenv RECORD incomplete")
              else:
                  q=_audit_wheel(path,{"name":name,"version":version,"filename":filename,"sha256":pinned},size)
                  if not q["bytes_verified"]: raise SystemExit("Wheel RECORD incomplete")
              st=path.lstat()
              if not stat.S_ISREG(st.st_mode) or st.st_nlink!=1: raise SystemExit("wheel archive file invalid")
              fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW)
              with os.fdopen(fd,"rb") as f:
                  initial=os.fstat(f.fileno())
                  h=hashlib.sha256()
                  while True:
                      b=f.read(1048576)
                      if not b:break
                      h.update(b)
                  if h.hexdigest()!=pinned:raise SystemExit("wheel compressed bytes mismatch")
                  f.seek(0);stream=hashlib.sha256();files=[]
                  with zipfile.ZipFile(f) as zip:
                      seen=set()
                      for member in zip.infolist():
                          path_member=member.filename.rstrip("/")
                          if path_member.casefold() in seen or not path_member or path_member.startswith("/") or "/../" in path_member:raise SystemExit("unsafe or colliding source member")
                          seen.add(path_member.casefold())
                          if member.is_dir():continue
                          data=zip.read(member)
                          if len(data)!=member.file_size:raise SystemExit("truncated member")
                          digest=hashlib.sha256(data).hexdigest()
                          stream.update(path_member.encode("utf-8")+b"\0"+digest.encode("ascii")+b"\n")
                          files.append({"path":path_member,"sha256":digest,"bytes":len(data)})
                  after=os.fstat(f.fileno());final=path.lstat()
                  def ident(s):return (s.st_dev,s.st_ino,s.st_size,s.st_mtime_ns,s.st_ctime_ns,s.st_nlink)
                  if ident(initial)!=ident(after) or ident(initial)!=ident(final):raise SystemExit("wheel changed during inventory")
              count,digest=original[name]
              if len(files)!=count or stream.hexdigest()!=digest:raise SystemExit("P006 original CI member stream mismatch for "+name)
              records[name]={"filename":filename,"actual_sha256":pinned,"archive_bytes":size,"regular_files":count,"p006_member_stream_sha256":digest,"members":sorted(files,key=lambda x:x["path"]),"source_security":"NOT_ISSUED","installed":False,"imported":False}
              print("PR101_R015_WHEEL_P006_CROSSCHECK="+name+" files="+str(count)+" stream="+digest)
          if len(records)!=9: raise SystemExit("nine Wheel source qualification incomplete")
          out=root/"pr101-r015-9-wheel-member-inventory.json"
          with out.open("x",encoding="utf-8") as f:
              json.dump({"head":"ec25c34492912f3a82175fa9c1060e0632814687","tree":"3a127bf341a0363b9fa77a570d88436a6fd48696","wheels":records,"source_security":"NOT_ISSUED","native_go_pipenv":"NOT_RUN","B_C_review":"NOT_REPLACED"},f,sort_keys=True,indent=2);f.write("\n")
          print("PR101_R015_NINE_SHA_RECORD_AND_P006_BYTE_STREAM=PASS count=9")
          PY

      - name: Collect ten exact raw source archives and immutable nonexecuting proof
        working-directory: frozen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/pr101-r015-review-raw-ten"
          cp "$RUNNER_TEMP/go1.27.3.darwin-arm64.tar.gz" "$RUNNER_TEMP/pr101-r015-review-raw-ten/"
          cp "$RUNNER_TEMP/pipenv-2026.10.4-py3-none-any.whl" "$RUNNER_TEMP/pr101-r015-review-raw-ten/"
          cp "$RUNNER_TEMP/lbe-p003-six-wheel-bytes/"*.whl "$RUNNER_TEMP/pr101-r015-review-raw-ten/"
          cp "$RUNNER_TEMP/r015-original-r004-two-locked-wheels/"*.whl "$RUNNER_TEMP/pr101-r015-review-raw-ten/"
          python3 -I -S - "$RUNNER_TEMP" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()))
          from tools.lbe_pipenv_p005_closure import EXPECTED
          from tools.lbe_t1_source_qualifier import GO_NAME,GO_SHA256,GO_SIZE
          root=Path(sys.argv[1]);target=root/"pr101-r015-review-raw-ten"
          expected={filename:sha for _,filename,sha in EXPECTED.values()}
          expected[GO_NAME]=GO_SHA256
          files=sorted(p for p in target.iterdir() if p.is_file())
          if len(files)!=10 or {p.name for p in files}!=set(expected):raise SystemExit("ten copied source archives incomplete or extra")
          checks={}
          for f in files:
              st=f.lstat()
              if not st.st_size or st.st_nlink!=1:raise SystemExit("archive copy type/size invalid")
              sha=hashlib.sha256(f.read_bytes()).hexdigest()
              if sha!=expected[f.name]:raise SystemExit("archive copy digest mismatch")
              if f.name==GO_NAME and st.st_size!=GO_SIZE:raise SystemExit("Go original archive length mismatched")
              checks[f.name]={"sha256":sha,"bytes":st.st_size}
          report={"pr":101,"review_round":"r015","head":"ec25c34492912f3a82175fa9c1060e0632814687","base":"0fc1ae245de7cb582a69162c79c201d15bfaa258","head_tree":"3a127bf341a0363b9fa77a570d88436a6fd48696","raw_archives":checks,"exact_count":10,"verified_original_go_manifest":"e43f516501f4e9b07de05dd470ffdab0b4c2acc086acf1e282d39c40fb00dc6a","go_native_T1":"NOT_RUN","pipenv_native_T1":"NOT_RUN","external_source_security":"NOT_ISSUED","B_C_independence":"NOT_REPLACED"}
          with (root/"pr101-r015-review-raw-ten"/"source-byte-provenance.json").open("x",encoding="utf-8") as out:
              json.dump(report,out,sort_keys=True,indent=2);out.write("\n")
          print("PR101_R015_RAW_TEN_RECOPIED_SHA256=PASS count=10")
          PY
          git diff --exit-code
          git diff --cached --exit-code
          echo "PR101_R015_NO_GO_PIPENV_EXEC=TRUE"
          echo "PR101_R015_NO_T2_T3_NO_USER_MAC_NO_TUNNEL=TRUE"
          echo "PR101_R015_FULL_SECURITY_REVIEW=NOT_ISSUED"

      - name: Upload review-accessible original ten source files and complete member manifests
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pr101-r015-exact-ten-source-only-raw-and-member-manifests
          path: |
            ${{ runner.temp }}/pr101-r015-review-raw-ten/
            ${{ runner.temp }}/pr101-r015-9-wheel-member-inventory.json
            ${{ runner.temp }}/lbe-p001-source-evidence.json
            ${{ runner.temp }}/lbe-p001-go-stage-evidence.json
            ${{ runner.temp }}/lbe-p007-go-source-report.json
            ${{ runner.temp }}/lbe-p003-wheel-byte-evidence.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
