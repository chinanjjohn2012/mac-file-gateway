name: C3 B03-T01-R2b-R2a source/object admission (COMPILE ONLY NO SIGNAL)

on:
  push:
    branches:
      - research/phase2-lite-c3-candidate-b-kill-t01-r2b-r2a-source-admission-20261022
  pull_request:
    paths:
      - ".github/workflows/c3-candidate-b-t01-r2b-r2a-source-admission.yml"
      - "docs/research/phase2-lite-c3/candidate-b-b03-t01-r2b-r2a-source-admission.md"
      - "tools/research/c3_candidate_b_t01_no_signal_candidate.c"
      - "tests/test_c3_candidate_b_t01_r2b_r2a_source_admission.py"
      - "MANIFEST.sha256"

permissions:
  contents: read

jobs:
  source-object-no-signal-admission:
    if: >-
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/research/phase2-lite-c3-candidate-b-kill-t01-r2b-r2a-source-admission-20261022') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'research/phase2-lite-c3-candidate-b-kill-t01-r2b-r2a-source-admission-20261022')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            python-version: "3.13"
          - os: macos-15
            python-version: "3.14"
          - os: ubuntu-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 9
    env:
      C3B03_T01_R2B_R2A_C_EXECUTION_ALLOWED: "false"
      C3B03_T01_R2B_R2A_GROUP_SIGNAL_AUTHORIZED: "false"
      C3B03_TEST_NO_SIGNAL_STUB: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Frozen Head, scope separation, Manifest SHA256
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          if [ "${{ matrix.os }}" = "macos-15" ]; then
            test "$(uname -s)" = Darwin
            test "$(uname -m)" = arm64
          fi
          test ! -e tools/research/c3_candidate_b_kill.c
          test ! -e tools/research/c3_candidate_b_kill_t01_no_signal_probe.py
          test ! -e tools/research/run_c3_candidate_b_kill.py
          test -f tools/research/c3_candidate_b_t01_no_signal_candidate.c
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for line in Path("MANIFEST.sha256").read_text().splitlines():
              digest, path = line.split("  ", 1)
              observed = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if digest != observed:
                  raise AssertionError(f"MANIFEST_DIFF {path} expected={digest} actual={observed}")
          print("C3B03_T01_R2B_R2A_MANIFEST_OK=true")
          print("C3B03_T01_R2B_R2A_C_EXECUTED=false")
          print("C3B03_T01_R2B_R2A_GROUP_SIGNAL_AUTHORIZED=false")
          PY
          python -m py_compile tests/test_c3_candidate_b_t01_r2b_r2a_source_admission.py
      - name: Read-only C object inspection + existing frozen pure Gate GREEN
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest==8.4.2
          python -m pytest -q tests/test_c3_candidate_b_t01_contract_red.py tests/test_c3_candidate_b_t01_pure_gate_r2.py tests/test_c3_candidate_b_t01_r2b_admission_design.py tests/test_c3_candidate_b_t01_r2b_r2a_source_admission.py
