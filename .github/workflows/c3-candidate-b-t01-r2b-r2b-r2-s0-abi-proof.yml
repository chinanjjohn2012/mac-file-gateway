name: C3 B03-T01 R2b-R2b-R2-S0 SOURCE and C11 ABI compile-only (NO LOAD)

on:
  push:
    branches:
      - research/phase2-lite-c3-candidate-b-kill-t01-r2b-r2b-r2-preload-s0-abi-20261022
  pull_request:
    paths:
      - ".github/workflows/c3-candidate-b-t01-r2b-r2b-r2-s0-abi-proof.yml"
      - "docs/research/phase2-lite-c3/candidate-b-b03-t01-r2b-r2b-r2-s0-abi-proof.md"
      - "tests/test_c3_candidate_b_t01_s0_abi_proof.py"
      - "tests/native/c3_b03_t01_abi_compile_only.c"
      - "tools/research/c3_candidate_b_t01_s0_abi_proof.py"
      - "MANIFEST.sha256"

permissions:
  contents: read

jobs:
  s0-source-and-abi-object-compile-only:
    if: >-
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/research/phase2-lite-c3-candidate-b-kill-t01-r2b-r2b-r2-preload-s0-abi-20261022') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'research/phase2-lite-c3-candidate-b-kill-t01-r2b-r2b-r2-preload-s0-abi-20261022')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            python-version: "3.13"
          - os: macos-15
            python-version: "3.14"
          - os: ubuntu-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      SOURCE_ONLY_NO_LOAD: "true"
      C3B03_T01_S0_GROUP_SIGNAL_AUTHORIZED: "false"
      C3B03_TEST_NO_SIGNAL_STUB: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Freeze exact Head, all Manifest bytes, C/header and absent runtime paths
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          if [ "${{ matrix.os }}" = "macos-15" ]; then
            test "$(uname -s)" = Darwin
            test "$(uname -m)" = arm64
          else
            test "$(uname -s)" = Linux
            test "$(uname -m)" = x86_64
          fi
          test ! -e tools/research/c3_candidate_b_kill.c
          test ! -e tools/research/c3_candidate_b_kill_t01_no_signal_probe.py
          test ! -e tools/research/run_c3_candidate_b_kill.py
          test ! -e tools/research/c3_candidate_b_t01_no_signal_candidate.dylib
          test ! -e tools/research/c3_candidate_b_t01_no_signal_candidate.so
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for row in Path("MANIFEST.sha256").read_text().splitlines():
              digest, path = row.split("  ", 1)
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if actual != digest:
                  raise AssertionError("MANIFEST_DIFF " + path)
          source = Path("tools/research/c3_candidate_b_t01_no_signal_candidate.c")
          header = Path("tests/native/c3_b03_t01_no_signal_contract.h")
          assert hashlib.sha256(source.read_bytes()).hexdigest() == (
              "5a1292787584632fac20c86bbe62e50153e82b0ecb36ad190446bf4b7b714195"
          )
          assert hashlib.sha256(header.read_bytes()).hexdigest() == (
              "7c9bd037ecf65da8de91605846c4ac4fc7ceaebbd0ca2fe983ecfef630c9958e"
          )
          print("C3B03_T01_S0_MANIFEST_OK=true")
          print("C3B03_T01_S0_SOURCE_ONLY_NO_LOAD=true")
          print("C3B03_T01_S0_C_EXECUTED=false")
          print("C3B03_T01_S0_NATIVE_DISPATCHES=0")
          print("C3B03_T01_S0_GROUP_SIGNAL_AUTHORIZED=false")
          PY
          python -m py_compile tools/research/c3_candidate_b_t01_s0_abi_proof.py tests/test_c3_candidate_b_t01_s0_abi_proof.py
      - name: Real test-owned C11 ABI -c proof and synthetic negative compiles (NEVER LOAD)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest==8.4.2
          # Only abi_compile_only.c is compiled to ephemeral .o; it has no
          # function entry, signal path or shared-object link flags.
          # No candidate C function or native shared library is ever executed.
          python -m pytest -q -s tests/test_c3_candidate_b_t01_s0_abi_proof.py tests/test_c3_candidate_b_t01_r2b_r2b_r2_source_only_adapter.py tests/test_c3_candidate_b_t01_r2b_r2b_d0_provenance_design.py tests/test_c3_candidate_b_t01_r2b_r2b_r2_preload_d1_design.py
