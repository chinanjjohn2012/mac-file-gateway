name: controlled-exec-tests

on:
  push:
    branches:
      - main
      - feature/controlled-exec
  pull_request:
    paths:
      - "gateway/**"
      - "tests/**"
      - "requirements*.txt"
      - "setup.sh"
      - "verify.sh"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python tests/smoke_live.py
      - run: python -m compileall -q gateway tests tools
      - run: bash -n setup.sh run.sh verify.sh tunnel.sh
      - name: Generate manifest candidate
        run: |
          find . -type f \
            ! -path './.git/*' \
            ! -path './.pytest_cache/*' \
            ! -path '*/__pycache__/*' \
            ! -path './MANIFEST.sha256' \
            ! -name '*.pyc' ! -name '*.pyo' -print0 \
          | sort -z | xargs -0 sha256sum
