name: F1 integrated RC isolated macOS ARM64 deny-only

on:
  pull_request:
    branches:
      - release/ms1
    paths:
      - ".github/workflows/multi-exec-f1-rc-macos-arm64.yml"
      - "MANIFEST.sha256"
      - "README.md"
      - "docs/MULTI_WORKSPACE_EXEC_RECOVERY_D0_DESIGN.md"
      - "docs/MULTI_WORKSPACE_EXEC_PRODUCTION_FIRST_IMPLEMENTATION_PLAN.md"
      - "docs/MULTI_WORKSPACE_EXEC_F1_RELEASE_CANDIDATE.md"

permissions:
  contents: read

jobs:
  f1-rc-deny-only:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'rc/multi-exec-f1-deny-only-ms1-20261025'
    runs-on: macos-15
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GATEWAY_NATIVE_C_ALLOWED: "false"
      C3B03_S3S6_FIRST_C_LOAD_AUTHORIZED: "false"
      C3B03_S3S6_GROUP_SIGNAL_AUTHORIZED: "false"
    steps:
      - name: Exact candidate checkout without Git write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Use Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Fail closed on runner architecture or target Base drift
        shell: bash
        run: |
          set -euo pipefail
          test "${{ runner.environment }}" = "github-hosted"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          [[ "$(sw_vers -productVersion)" == 15.* ]]
          test "${{ github.event.pull_request.base.sha }}" = "2f163eeb83fc2f984354dc6d231a614dca5aa9af"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import platform
          import sys
          assert sys.platform == "darwin"
          assert platform.machine().lower() == "arm64"
          assert sys.version_info >= (3, 13)
          print("F1_RC_HOST=" + platform.platform())
          print("F1_RC_PYTHON=" + sys.version.split()[0])
          print("F1_RC_REAL_EXEC_APPLY=FORBIDDEN")
          print("F1_RC_F3_NATIVE_SIGNALS=FORBIDDEN")
          PY

      - name: Validate fixed F1 source, RC-only delta and full tracked Manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import subprocess

          origin = "f11721765c3f64e3ab18c425fb9b642dc40f6ec7"
          allowed = {
              ".github/workflows/multi-exec-f1-rc-macos-arm64.yml",
              "docs/MULTI_WORKSPACE_EXEC_F1_RELEASE_CANDIDATE.md",
              "docs/MULTI_WORKSPACE_EXEC_RECOVERY_D0_DESIGN.md",
              "docs/MULTI_WORKSPACE_EXEC_PRODUCTION_FIRST_IMPLEMENTATION_PLAN.md",
              "README.md",
              "MANIFEST.sha256",
          }
          subprocess.run(["git", "merge-base", "--is-ancestor", origin, "HEAD"], check=True)
          actual = set(subprocess.check_output(
              ["git", "diff", "--name-only", origin, "HEAD"], text=True
          ).splitlines())
          assert actual == allowed, ("Unexpected product/contract delta", actual)
          rows = Path("MANIFEST.sha256").read_text(encoding="ascii").splitlines()
          paths = []
          for row in rows:
              digest, rel = row.split("  ", 1)
              assert rel.startswith("./") and len(digest) == 64, rel
              paths.append(rel)
              assert hashlib.sha256(Path(rel).read_bytes()).hexdigest() == digest, rel
          assert paths == sorted(set(paths)), "Manifest not sorted/unique"
          tracked = {b.decode("utf-8") for b in subprocess.check_output(
              ["git", "ls-files", "-z"]).split(b"\0") if b}
          tracked.remove("MANIFEST.sha256")
          assert set(paths) == {"./" + rel for rel in tracked}, "Incomplete Manifest"
          # Static product-source gate only; this is NOT proof of dynamic import
          # safety, full OS isolation, or a replacement for B/C source review.
          forbidden = ("_exec_test_grant", "_exec_test_transport",
                       "create_private_disposable_acceptance",
                       "TestOnlyGroupRetirementGrant", "_TrustedLoopbackListener")
          for file in Path("gateway").rglob("*.py"):
              if file.name in {"_exec_test_grant.py", "_exec_test_transport.py"}:
                  continue
              code = file.read_text(encoding="utf-8")
              assert all(term not in code for term in forbidden), file
          rev = lambda field: subprocess.check_output(
              ["git", "rev-parse", field], text=True).strip()
          print("F1_RC_FIXED_SOURCE=" + origin)
          print("F1_RC_HEAD=" + rev("HEAD"))
          print("F1_RC_TREE=" + rev("HEAD^{tree}"))
          print("F1_RC_TRACKED_MANIFEST=PASS")
          print("F1_RC_RUNTIME_AND_TEST_FILES=UNCHANGED")
          print("F1_RC_STATIC_TEST_ONLY_IMPORT_SCREEN=PASS_NOT_FULL_PROOF")
          PY

      - name: Install existing test dependencies only
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Real REST/MCP TCP deny-only and independent Git/File Apply
        run: python -m pytest -q -p no:cacheprovider tests/test_multi_exec_f1.py

      - name: Safe Preview, owner-lock, UNKNOWN/quarantine and Worker regression
        run: >
          python -m pytest -q -p no:cacheprovider
          tests/test_multi_exec_product.py
          tests/test_exec_state_t01.py
          tests/test_multi_exec_boot_b0.py

      - name: Verify no tracked changes from isolated tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          echo "F1_RC_MACOS_ARM64_DENY_ONLY=TESTED"
          echo "F1_RC_EXEC_APPLY=NOT_RUN; F3_TEST=NOT_RUN"
          echo "F1_RC_NO_LOCAL_GATEWAY_TUNNEL; NO_MERGE; NO_DEPLOY"
