name: PR101 authorized macOS ARM64 original child T1

on:
  pull_request:
    branches:
      - rc/multi-exec-f1-g05-integrated-ms1-20261025
    paths:
      - ".github/workflows/multi-exec-lbe-native-t1-macos-arm64.yml"
      - "gateway/lbe_*.py"
      - "gateway/workspaces.py"
      - "tests/test_lbe_native_t1.py"
      - "MANIFEST.sha256"

permissions:
  contents: read

concurrency:
  group: pr101-original-child-t1-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bounded-disposable-macos-t1:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/multi-exec-lbe-v2-config-preflight-r001-20261030' &&
      github.event.pull_request.base.sha == '0fc1ae245de7cb582a69162c79c201d15bfaa258'
    runs-on: macos-15
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: ""
      LBE_NATIVE_T1_AUTHORIZED: PR101_R002_MACOS15_ARM64_DISPOSABLE_PYTHON_ONLY
      GATEWAY_NATIVE_C_ALLOWED: "false"
      C3B03_S3S6_FIRST_C_LOAD_AUTHORIZED: "false"
      C3B03_S3S6_GROUP_SIGNAL_AUTHORIZED: "false"
    steps:
      - name: Checkout exact Head without stored credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Early G05 and ephemeral hosted macOS ARM64 gate
        shell: bash
        env:
          G05_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "${{ runner.environment }}" = github-hosted
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          [[ "$(sw_vers -productVersion)" == 15.* ]]
          python3 -I -S tools/g05_ci_admission.py --expected-head "$G05_EXPECTED_HEAD"
          echo "LBE_NATIVE_T1_EXECUTED_HEAD=$(git rev-parse HEAD)"
          echo "LBE_NATIVE_T1_EXECUTED_TREE=$(git rev-parse 'HEAD^{tree}')"

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Derive original 36 wheel exact-version constraints
        shell: bash
        run: |
          set -euo pipefail
          python -I -S tools/ci_wheel_constraints.py --source-lock ci/wheel-locks/macos-15-arm64-3.13.sha256 > "$RUNNER_TEMP/lbe-native-constraints.txt"

      - name: Download source-locked binary Wheels into runner scratch
        run: >-
          python -m pip download --disable-pip-version-check --only-binary=:all:
          -r requirements-dev.txt --constraint "$RUNNER_TEMP/lbe-native-constraints.txt"
          --dest "$RUNNER_TEMP/lbe-native-wheelhouse"

      - name: Verify all source-locked wheel bytes before install
        run: >-
          python -I -S tools/ci_dependency_provenance.py wheels
          --wheelhouse "$RUNNER_TEMP/lbe-native-wheelhouse"
          --wheel-record "$RUNNER_TEMP/lbe-native-wheels.json"
          --source-lock ci/wheel-locks/macos-15-arm64-3.13.sha256

      - name: Install offline and attest installed RECORD-listed file bytes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-index --find-links "$RUNNER_TEMP/lbe-native-wheelhouse" --force-reinstall --constraint "$RUNNER_TEMP/lbe-native-constraints.txt" -r requirements-dev.txt
          python -m pip check
          python -I tools/ci_dependency_provenance.py installed --wheelhouse "$RUNNER_TEMP/lbe-native-wheelhouse" --wheel-record "$RUNNER_TEMP/lbe-native-wheels.json" --source-lock ci/wheel-locks/macos-15-arm64-3.13.sha256 --installed-record "$RUNNER_TEMP/lbe-native-installed.json"

      - name: Bounded natural-exit T1 Python Direct in isolated runner scratch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lbe-native-pytest"
          python -m pytest -q -rs -p no:cacheprovider --basetemp "$RUNNER_TEMP/lbe-native-pytest" tests/test_lbe_native_t1.py | tee "$RUNNER_TEMP/lbe-native-t1-log.txt"
          grep -E '6 passed' "$RUNNER_TEMP/lbe-native-t1-log.txt"
          echo "LBE_NATIVE_T1_REAL_PYTHON_DIRECT=PASS"
          echo "LBE_NATIVE_T1_MAX_REQUEST_SECONDS=5"
          echo "LBE_NATIVE_T1_MAX_OUTPUT_PER_STREAM_BYTES=48000"
          echo "LBE_NATIVE_T1_MAX_ACTIVE_PER_WORKSPACE=1"
          echo "LBE_NATIVE_T1_MAX_ACTIVE_PER_SERVICE=4"

      - name: Reverify pinned Wheels and installed RECORD-listed hashes
        run: >-
          python -I tools/ci_dependency_provenance.py verify
          --wheelhouse "$RUNNER_TEMP/lbe-native-wheelhouse"
          --wheel-record "$RUNNER_TEMP/lbe-native-wheels.json"
          --source-lock ci/wheel-locks/macos-15-arm64-3.13.sha256
          --installed-record "$RUNNER_TEMP/lbe-native-installed.json"

      - name: Confirm immutable tracked tree and report unrun risk scopes
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          echo "LBE_NATIVE_T1_TERMINATION_OR_PID_SIGNAL_T2=NOT_RUN"
          echo "LBE_NATIVE_T1_GO_OR_PIPENV_REAL_POSITIVE=NOT_RUN"
          echo "LBE_NATIVE_T1_SHARED_REST_OFFICIAL_MCP_POSITIVE=NOT_RUN"
          echo "LBE_NATIVE_T1_USER_MAC_TUNNEL_T3=NOT_RUN"
          echo "LBE_NATIVE_T1_FULL_DESCENDANT_CLEAN=NOT_PROVEN"
          echo "CI_UNLISTED_IMPORTABLE_FILES=NOT_ASSESSED"
          echo "LBE_NATIVE_T1_NO_MERGE_NO_DEPLOY"
