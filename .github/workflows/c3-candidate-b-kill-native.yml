name: C3 Candidate B B-03 R1 contract RED (NO NATIVE SIGKILL)

on:
  push:
    branches:
      - research/phase2-lite-c3-candidate-b-kill-red-20261021
  pull_request:
    paths:
      - ".github/workflows/c3-candidate-b-kill-native.yml"
      - "tests/test_c3_candidate_b_kill.py"
      - "docs/research/phase2-lite-c3/candidate-b-b03-kill-design.md"
      - "MANIFEST.sha256"

permissions:
  contents: read

jobs:
  b03-r1-darwin-contract-red:
    if: >-
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/research/phase2-lite-c3-candidate-b-kill-red-20261021') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'research/phase2-lite-c3-candidate-b-kill-red-20261021')
    runs-on: macos-15
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify Darwin ARM64 and frozen test HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          sw_vers -productVersion
          uname -v

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: arm64

      - name: B03-R1 SAFETY preflight - NO KILL Helper or Runner exists
        shell: bash
        run: |
          set -euo pipefail
          test ! -f tools/research/c3_candidate_b_kill.c
          test ! -f tools/research/run_c3_candidate_b_kill.py
          test -f docs/research/phase2-lite-c3/candidate-b-b03-kill-design.md
          test -f tests/test_c3_candidate_b_kill.py
          python -m py_compile tests/test_c3_candidate_b_kill.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for line in Path("MANIFEST.sha256").read_text().splitlines():
              expected, path = line.split("  ", 1)
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == expected, path
          print("C3B03_R1_MANIFEST_OK=true")
          PY

      - name: B03-R1 EXPECTED CONTRACT RED - no native SIGKILL
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest==8.4.2
          # Deliberately exit nonzero: Helper/Runner do not exist at B03-R1.
          # Do NOT invert pytest exit status or claim this is a GREEN run.
          python -m pytest -q tests/test_c3_candidate_b_kill.py
