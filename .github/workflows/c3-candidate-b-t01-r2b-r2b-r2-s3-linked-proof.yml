name: C3 B03-T01 R2b-R2b-R2-S3 SAME-SESSION LINKED STATIC NO LOAD

on:
  push:
    branches:
      - research/phase2-lite-c3-b03-t01-s3-linked-provenance-20261022
  pull_request:
    paths:
      - ".github/workflows/c3-candidate-b-t01-r2b-r2b-r2-s3-linked-proof.yml"
      - "docs/research/phase2-lite-c3/candidate-b-b03-t01-r2b-r2b-r2-s3-linked-proof.md"
      - "tools/research/c3_candidate_b_t01_s3_linked_proof.py"
      - "tests/test_c3_candidate_b_t01_s3_linked_proof.py"
      - "MANIFEST.sha256"
permissions:
  contents: read
jobs:
  same-session-static-linked-no-load:
    if: >-
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/research/phase2-lite-c3-b03-t01-s3-linked-provenance-20261022') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'research/phase2-lite-c3-b03-t01-s3-linked-provenance-20261022')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            python-version: "3.13"
          - os: macos-15
            python-version: "3.14"
          - os: ubuntu-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      C3B03_S3_NO_LOAD: "true"
      C3B03_S3_NATIVE_DISPATCHES: "0"
      C3B03_S3_GROUP_SIGNAL_AUTHORIZED: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate immutable inputs, HEAD, MANIFEST, scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test ! -e tools/research/c3_candidate_b_kill.c
          test ! -e tools/research/c3_candidate_b_kill_t01_no_signal_probe.py
          test ! -e tools/research/run_c3_candidate_b_kill.py
          if [ "${{ matrix.os }}" = "macos-15" ]; then
            test "$(uname -s)" = Darwin
            test "$(uname -m)" = arm64
          else
            test "$(uname -s)" = Linux
            test "$(uname -m)" = x86_64
          fi
          python - <<'PY'
          import hashlib
          from pathlib import Path
          lines = Path("MANIFEST.sha256").read_text().splitlines()
          assert lines == sorted(lines)
          for row in lines:
              digest, name = row.split("  ", 1)
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          frozen = {
              "tools/research/c3_candidate_b_t01_no_signal_candidate.c": "5a1292787584632fac20c86bbe62e50153e82b0ecb36ad190446bf4b7b714195",
              "tests/native/c3_b03_t01_no_signal_contract.h": "7c9bd037ecf65da8de91605846c4ac4fc7ceaebbd0ca2fe983ecfef630c9958e",
          }
          for path, digest in frozen.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest, path
          print("C3B03_S3_MANIFEST_OK=true")
          print("C3B03_S3_GROUP_SIGNAL_AUTHORIZED=false")
          PY
      - name: Real same-session object and transient linked-image static inspection only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest==8.4.2
          python -m pytest -q -s tests/test_c3_candidate_b_t01_s3_linked_proof.py tests/test_c3_candidate_b_t01_s2_object_proof.py tests/test_c3_candidate_b_t01_s0_abi_proof.py tests/test_c3_candidate_b_t01_r2b_r2b_r2_source_only_adapter.py tests/test_c3_candidate_b_t01_r2b_r2b_r2_preload_d1_design.py
