name: Multi-Workspace Exec B1-B1-B private bridge expected RED

on:
  pull_request:
    branches:
      - test/multi-exec-recovery-r2-t02-b1b1-default-deny-red-20261024
    paths:
      - ".github/workflows/multi-exec-b1b1b-private-bridge-red.yml"
      - "tests/b1b1b_contracts/**"
      - "tools/verify_multi_exec_b1b1b_private_bridge_red.py"
      - "docs/MULTI_WORKSPACE_EXEC_R2_T02_B1B1_B_R0.md"
      - "MANIFEST.sha256"

permissions:
  contents: read

jobs:
  b1b1b-expected-red:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/multi-exec-recovery-r2-t02-b1b1b-private-bridge-red-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GATEWAY_NATIVE_C_ALLOWED: "false"
      C3B03_S3S6_FIRST_C_LOAD_AUTHORIZED: "false"
      C3B03_S3S6_GROUP_SIGNAL_AUTHORIZED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Pin Head and full tracked Manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor c58269c798b62775f8621d69fa037d614c8861da HEAD
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import subprocess
          names = []
          for row in Path("MANIFEST.sha256").read_text(encoding="ascii").splitlines():
              digest, filename = row.split("  ", 1)
              assert filename.startswith("./")
              names.append(filename)
              assert hashlib.sha256(Path(filename).read_bytes()).hexdigest() == digest
          assert names == sorted(set(names))
          tracked = {x.decode("utf-8") for x in subprocess.check_output(
              ["git", "ls-files", "-z"]).split(b"\0") if x}
          tracked.remove("MANIFEST.sha256")
          assert set(names) == {"./" + x for x in tracked}
          print("B1B1B_EXPECTED_RED_HEAD=" + subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True).strip())
          print("B1B1B_EXPECTED_RED_TREE=" + subprocess.check_output(
              ["git", "rev-parse", "HEAD^{tree}"], text=True).strip())
          print("B1B1B_MANIFEST=PASS")
          PY
      - name: Keep product and earlier reviewed contracts byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code c58269c798b62775f8621d69fa037d614c8861da HEAD -- \
            gateway/ tests/test_multi_exec_product.py \
            tests/test_multi_exec_private_acceptance_b1a.py \
            tests/test_multi_exec_bound_transport_b1b0.py \
            tests/b1b1_contracts/contract_multi_exec_default_deny_b1b1.py \
            tools/verify_multi_exec_b1b1_default_deny_red.py \
            docs/MULTI_WORKSPACE_EXEC_R2_T02_B1B1_A.md
          echo "B1B1B_PRIOR_PRODUCT_AND_RED_BLOBS=UNCHANGED"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Existing full real product tests remain GREEN
        run: python -m pytest -q
      - name: Prior B1-B1-A 11 RED and 31 GREEN frozen
        run: python tools/verify_multi_exec_b1b1_default_deny_red.py
      - name: New private bridge 24 expected RED and 18 GREEN
        run: python tools/verify_multi_exec_b1b1b_private_bridge_red.py
