name: C3 Candidate B T01-R1 CONTRACT RED (NO SIGNAL)

on:
  push:
    branches:
      - research/phase2-lite-c3-candidate-b-kill-t01-contract-red-20261021
  pull_request:
    paths:
      - ".github/workflows/c3-candidate-b-t01-contract-red.yml"
      - "tests/test_c3_candidate_b_t01_contract_red.py"
      - "docs/research/phase2-lite-c3/candidate-b-b03-t01-r1-contract.md"
      - "MANIFEST.sha256"

permissions:
  contents: read

jobs:
  t01-r1-no-signal-contract-red:
    if: >-
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/research/phase2-lite-c3-candidate-b-kill-t01-contract-red-20261021') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'research/phase2-lite-c3-candidate-b-kill-t01-contract-red-20261021')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            python-version: "3.13"
          - os: macos-15
            python-version: "3.14"
          - os: ubuntu-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      C3_T01_NO_GROUP_SIGNAL: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact head, architecture and NO-SIGNAL surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          if [ "${{ matrix.os }}" = "macos-15" ]; then
            test "$(uname -s)" = Darwin
            test "$(uname -m)" = arm64
          fi
          test ! -e tools/research/c3_candidate_b_kill.c
          test ! -e tools/research/run_c3_candidate_b_kill.py
          test ! -e tools/research/c3_candidate_b_kill_t01_gate.py
          test -f tests/test_c3_candidate_b_kill_t01_contract_red.py
          test -f docs/research/phase2-lite-c3/candidate-b-b03-t01-r1-contract.md
          python - <<'PY'
          import ast
          import hashlib
          from pathlib import Path
          for line in Path("MANIFEST.sha256").read_text().splitlines():
              expected, path = line.split("  ", 1)
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == expected, path
          source = Path("tests/test_c3_candidate_b_t01_contract_red.py").read_text()
          tree = ast.parse(source)
          unsafe = {"kill", "killpg", "fork", "system", "Popen", "run", "exec", "spawn", "raise_signal"}
          for n in ast.walk(tree):
              if not isinstance(n, ast.Call):
                  continue
              name = n.func.attr if isinstance(n.func, ast.Attribute) else (
                  n.func.id if isinstance(n.func, ast.Name) else "")
              assert name not in unsafe, f"NO-SIGNAL contract calls forbidden API: {name}"
          print("C3B03_T01_R1_MANIFEST_OK=true")
          print("C3B03_T01_R1_SIGNAL_CAPABILITY=false")
          PY
          python -m py_compile tests/test_c3_candidate_b_t01_contract_red.py
      - name: T01-R1 EXPECTED RED — real missing implementation, no native group calls
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest==8.4.2
          python -m pytest -q tests/test_c3_candidate_b_t01_contract_red.py
          # Exit code must stay nonzero until the separate T01-R2 implementation.
          # Never invert the pytest status or report a skipped test as GREEN.
