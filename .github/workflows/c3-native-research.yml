name: C3 isolated native Relay research (NOT G2)

on:
  push:
    branches:
      - research/phase2-lite-c3-native-20261021
  pull_request:
    paths:
      - ".github/workflows/c3-native-research.yml"
      - "tools/research/c3_relay_probe.c"
      - "tools/research/run_c3_relay_probe.py"
      - "tests/test_c3_relay_research.py"
      - "docs/research/phase2-lite-c3/**"

permissions:
  contents: read

jobs:
  c3-darwin:
    if: >-
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/research/phase2-lite-c3-native-20261021') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'research/phase2-lite-c3-native-20261021')
    runs-on: macos-15
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify fixed macOS native ARM64 checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          sw_vers -productVersion
          uname -v
          xcrun --find cc
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: arm64
      - name: Check C3 design/driver contracts, not product G2
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest==8.4.2
          python -VV
          python -m pytest -q tests/test_c3_relay_research.py
      - name: Test only newly created disposable synthetic process group
        shell: bash
        run: |
          set -euo pipefail
          private_dir="$(mktemp -d)"
          chmod 700 "$private_dir"
          trap 'rm -rf "$private_dir"' EXIT
          python tools/research/run_c3_relay_probe.py --evidence-dir "$private_dir"
          python - "$private_dir/c3_relay_private.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          assert data["g2_qualified"] is False
          assert data["decision"] == "PARTIAL_NATIVE_C3_ONLY_NOT_G2"
          expected = [
              ("term-default", "POSITIVE_EXPERIMENT"),
              ("kill-unknown", "POSITIVE_EXPERIMENT"),
              ("leader-exit", "SAFE_REFUSAL"),
              ("competing-reap", "EXPECTED_BLOCK"),
              ("ipc-forgery", "EXPECTED_BLOCK"),
              ("identity-loss", "SAFE_REFUSAL"),
          ]
          assert [(c["mode"], c["status"]) for c in data["cases"]] == expected
          assert all(c["after_loss_signals"] == 0 for c in data["cases"])
          assert data["cases"][1]["worker"] == "UNKNOWN"
          assert data["cases"][1]["cleanup"] == "UNRESOLVED"
          print("C3_NATIVE_RESULT=PARTIAL_NATIVE_C3_ONLY_NOT_G2")
          PY
