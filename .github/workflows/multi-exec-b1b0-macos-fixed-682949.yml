name: B1-B0 fixed-Head macOS ARM64 Listener acceptance

on:
  pull_request:
    branches:
      - feature/multi-exec-recovery-r2-t02-b1b0-bound-listener-20261023
    paths:
      - ".github/workflows/multi-exec-b1b0-macos-fixed-682949.yml"

permissions:
  contents: read

jobs:
  native-fixed-pr65:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'evidence/multi-exec-b1b0-macos-arm64-682949' &&
      github.event.pull_request.base.sha == '682949dde29f35567a67748b3edde8196d910d9d'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GATEWAY_NATIVE_C_ALLOWED: "false"
      C3B03_S3S6_FIRST_C_LOAD_AUTHORIZED: "false"
      C3B03_S3S6_GROUP_SIGNAL_AUTHORIZED: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      FIXED_PR65_HEAD: "682949dde29f35567a67748b3edde8196d910d9d"
      FIXED_PR65_TREE: "1d021d5d41a22004b341fe5a2c52385fb868b294"
    steps:
      - name: Check out PR65 exact Head, not evidence PR merge commit
        uses: actions/checkout@v4
        with:
          ref: 682949dde29f35567a67748b3edde8196d910d9d
          persist-credentials: false
      - name: Set Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Authenticate native machine and exact immutable source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "$FIXED_PR65_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$FIXED_PR65_TREE"
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import hashlib
          import platform
          import subprocess
          import sys
          from pathlib import Path

          assert platform.system() == "Darwin", platform.system()
          assert platform.machine() == "arm64", platform.machine()
          assert sys.version_info[:2] == (3, 13), sys.version
          manifest = Path("MANIFEST.sha256").read_text(encoding="ascii").splitlines()
          names = []
          for line in manifest:
              digest, filename = line.split("  ", 1)
              assert filename.startswith("./"), filename
              names.append(filename)
              assert hashlib.sha256(Path(filename).read_bytes()).hexdigest() == digest, filename
          assert names == sorted(names) and len(names) == len(set(names))
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode("utf-8").strip("\0").split("\0")
          assert set(names) == {"./" + x for x in tracked if x != "MANIFEST.sha256"}
          for required in ("./gateway/_exec_test_transport.py", "./gateway/_exec_test_grant.py",
                           "./tests/test_multi_exec_bound_transport_b1b0.py",
                           "./tests/test_multi_exec_private_acceptance_b1a.py",
                           "./tests/test_multi_exec_boot_b0.py"):
              assert required in names
          print("FIXED_PR65_MACOS_ARM64_HEAD_OK")
          print("HEAD=" + subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip())
          print("TREE=" + subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip())
          print("PLATFORM=" + platform.platform() + " PYTHON=" + platform.python_version())
          print("NATIVE_C_DISABLED=1; NO USER GATEWAY/TUNNEL; NO PRODUCTION EXEC")
          PY
      - name: Install product test dependencies on fresh ARM64 runner
        shell: bash
        run: python -m pip install -r requirements-dev.txt
      - name: Real TCP REST/MCP Listener and Darwin SO_ACCEPTCONN fallback
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -ra --junitxml="$RUNNER_TEMP/b1b0-listener.xml" tests/test_multi_exec_bound_transport_b1b0.py
      - name: Private grant owner-flock and boot-state negative boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -ra --junitxml="$RUNNER_TEMP/b1a-boot-state.xml" tests/test_multi_exec_private_acceptance_b1a.py tests/test_multi_exec_boot_b0.py
      - name: Require every B1-B0 real Listener contract to run, with zero skips
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          test_source = Path("tests/test_multi_exec_bound_transport_b1b0.py")
          declared = {node.name for node in ast.parse(test_source.read_text()).body
                      if isinstance(node, ast.FunctionDef) and node.name.startswith("test_")}
          assert len(declared) >= 16, f"Only {len(declared)} Listener contracts found"
          reports = [
              Path(os.environ["RUNNER_TEMP"]) / "b1b0-listener.xml",
              Path(os.environ["RUNNER_TEMP"]) / "b1a-boot-state.xml",
          ]
          for path in reports:
              root = ET.parse(path).getroot()
              cases = root.findall(".//testcase")
              assert cases, f"No actual tests executed: {path}"
              for case in cases:
                  assert not any(case.find(k) is not None for k in ("error", "failure", "skipped")), (
                      path, case.attrib)
              print(f"ARM64_ACCEPTANCE_CASES: {path.name}={len(cases)}; all executed")
              if path.name == "b1b0-listener.xml":
                  ran = {case.attrib["name"].split("[", 1)[0] for case in cases}
                  assert ran == declared, (
                      "Missing or unexpected Listener contract cases", sorted(declared - ran),
                      sorted(ran - declared))
          print("B1B0_FIXED_HEAD_ARM64_LISTENER_ACCEPTANCE_PASS")
          PY
      - name: Store immutable native evidence JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr65-b1b0-macos-arm64-fixed-682949
          path: |
            ${{ runner.temp }}/b1b0-listener.xml
            ${{ runner.temp }}/b1a-boot-state.xml
          if-no-files-found: warn
          retention-days: 21
